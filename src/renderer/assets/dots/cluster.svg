<!-- Three exact circles, replacing the traced outlines. Measured off the trace, all three were
     round to within half a percent (aspect 1.00, radius spread 0.30%, 0.46% and 0.34%), which
     is close enough to be obviously intended and far enough to show as a rough rim at 32px.
     Centres and mean radii are the trace's own. -->
<!-- 5 units of air beyond the circles. Fitted exactly, the small circle's lowest point sat on
     the viewport's bottom edge (its centre 583.83 plus radius 31.09 is 614.92, and the box
     ended at 614.92), so an <svg>'s clip to its own viewport sliced the base off it. -->
<svg version="1.1" viewBox="361.57 361.49 257.99 258.43" preserveAspectRatio="xMidYMid meet" overflow="visible" xmlns="http://www.w3.org/2000/svg">
 <circle fill="currentColor" cx="539.97" cy="441.08" r="74.59"/>
 <circle fill="currentColor" cx="416.29" cy="527.73" r="49.72"/>
 <circle fill="currentColor" cx="534.04" cy="583.83" r="31.09"/>
</svg>
