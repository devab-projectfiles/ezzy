<!-- Two exact circles, not the traced outline they replace.
     The mark came from a bitmap trace, so each "circle" was a few dozen bezier segments
     wobbling around one: measured, the disc held a radius of 226.35 +/- 0.22% and the
     satellite 26.53 +/- 1.04%. At 32px that is what makes the rim look chewed. The trace's
     own centres and mean radii are kept exactly, with the group transform folded in, so the
     mark is the same mark — only the edge is now round by definition rather than by luck. -->
<!-- The viewBox carries 9.5 units of air beyond the circles rather than hugging them.
     Fitted exactly, the disc touched the viewport on all four sides, and an <svg> clips to
     its viewport — so the half-covered pixel row at each extreme was cut and the top and
     bottom of the circle read as flats. overflow:visible is the belt to that braces. -->
<svg version="1.1" viewBox="242.63 233.55 490.74 491.46" preserveAspectRatio="xMidYMid meet" overflow="visible" xmlns="http://www.w3.org/2000/svg">
 <circle fill="currentColor" cx="478.477" cy="489.157" r="226.35"/>
 <circle fill="currentColor" cx="697.337" cy="269.577" r="26.53"/>
</svg>
