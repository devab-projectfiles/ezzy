appId: com.ezzy.app
productName: Ezzy
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Native binaries cannot live in the asar, so whisper ships beside it and is
# resolved through process.resourcesPath at runtime. Fetched by scripts/fetch-whisper.mjs —
# an installer built without running that has no voice in it.
extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - '**/*'
asarUnpack:
  - resources/**
  # Native binaries cannot be loaded from inside the asar. koffi resolves its
  # own .node at runtime, so leaving it packed is the classic "works in dev, broken in the
  # installer" failure — the window list would simply be empty in a packaged build.
  - node_modules/koffi/**
win:
  executableName: Ezzy
  # Both targets ship. The installer is what most people download and the only target
  # electron-updater can update in place; the zip is what the Scoop manifest fetches, and what
  # anyone who will not click past SmartScreen to run an unsigned installer can unpack and run.
  target:
    - nsis
    - zip
  # Applies to the zip; nsis has its own name below, which takes precedence for the installer.
  artifactName: Ezzy-${version}-portable.${ext}
nsis:
  artifactName: Ezzy-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Per-user, so the installer never raises a UAC prompt on top of the SmartScreen warning it
  # already has to get past. It also keeps electron-updater able to replace the install
  # without elevation, which is the whole point of shipping updates at all.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# electron-updater reads GitHub Releases, which needs no server and no certificate.
# electron-builder writes latest.yml alongside the installer here; that file is the feed.
publish:
  provider: github
  owner: devab-projectfiles
  repo: ezzy
